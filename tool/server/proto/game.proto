syntax = "proto3";

// 生成 proto 文件所在包路径
package proto.game;

// 消息号
enum MsgId {
  HEART_BEAT = 0; // 心跳
  PING = 1;
  PONG = 2;
}

// 错误码
enum ErrCode {
  SUCCESS = 0;
  FAIL = 1;
}

// 响应码
message RespCode {
  ErrCode err_code = 1;
  optional string msg = 2;
}

// 心跳请求(速率: 10秒/1次 )
message HeartBeatReq {
}

// 心跳响应
message HeartBeatResp {
  RespCode resp_code = 1;
}

// Ping
message PingReq {
  int64 timestamp = 1;
}

// Pong
message PongResp {
  int64 timestamp = 1;
}
